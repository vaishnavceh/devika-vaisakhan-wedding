services:
  - type: web
    name: devika-vaisakhan-wedding
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
